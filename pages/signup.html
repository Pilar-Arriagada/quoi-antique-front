<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="text-center mb-4">Inscription</h1>

            <form id="signupForm">
                <div class="mb-3">
                    <label for="lastNameInput" class="form-label">Nom</label>
                    <input
                        type="text"
                        class="form-control"
                        id="lastNameInput"
                        name="lastName"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="firstNameInput" class="form-label">Prénom</label>
                    <input
                        type="text"
                        class="form-control"
                        id="firstNameInput"
                        name="firstName"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="signupEmailInput" class="form-label">
                        Adresse e-mail
                    </label>
                    <input
                        type="email"
                        class="form-control"
                        id="signupEmailInput"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="signupPasswordInput" class="form-label">
                        Mot de passe
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="signupPasswordInput"
                        name="password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="passwordConfirmInput" class="form-label">
                        Confirmez votre mot de passe
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="passwordConfirmInput"
                        name="passwordConfirm"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                        S’inscrire
                    </button>
                </div>
            </form>

            <p class="text-center mt-3">
                Vous avez déjà un compte ?
                <a href="/signin" onclick="route(event)">
                    Connectez-vous
                </a>
            </p>
        </div>
    </div>
</section>
